# SPDX-License-Identifier: GPL-3.0-or-later
# Socle Rust / Qt 6 de MMail — fabrication continue sur les quatre cibles.
#
# Chaque cible se construit, s'éprouve (tests du noyau, puis test de fumée : la
# fenêtre se crée, l'index local s'écrit et se relit, le coffre répond) puis
# s'empaquette. Le contrôle porte aussi sur le paquet, et non sur le seul binaire
# de construction : c'est le paquet qui part aux postes.
name: socle

on:
  push:
    branches: [main, "socle/**"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  CARGO_TERM_COLOR: always

jobs:
  bureau:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # L'AppImage embarque tout sauf la glibc du système : elle ne tourne
          # que sur une glibc au moins aussi récente que celle de sa fabrication.
          # Construite sur ubuntu-24.04 (glibc 2.39), elle refusait Debian 12 et
          # Ubuntu 22.04 ; ubuntu-22.04 (glibc 2.35) les couvre.
          - { nom: linux,   os: ubuntu-22.04 }
          - { nom: windows, os: windows-2022 }
          - { nom: macos,   os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> ../_build/cargo
          # La clé par défaut ne distingue pas les versions d'Ubuntu : des objets
          # compilés sous glibc 2.39 (__isoc23_*) ne se lient pas sous 2.35.
          key: ${{ matrix.os }}
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""
          cache: true
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev ninja-build libsecret-1-dev
      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configuration
        run: cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release
        shell: bash
        env:
          CMAKE_MAKE_PROGRAM: ninja
      - name: Construction
        run: cmake --build _build --config Release
      - name: Tests du noyau
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test de fumée
        run: ctest --test-dir _build --output-on-failure -C Release
        env:
          QT_QPA_PLATFORM: offscreen

      # ---- Windows : l'installeur que reçoivent les postes -----------------
      - name: Paquet Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          mkdir -p dist/MMail
          # Le nom du fichier compte : les associations « Ouvrir avec » posées par
          # l'installeur désignent MMail.exe, pas le nom de la cible CMake.
          cp _build/mmail.exe dist/MMail/MMail.exe
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir core/qml dist/MMail/MMail.exe
          # Runtime Visual C++ (Qt, main.cpp et le noyau Rust en dépendent) déposé à côté
          # de l'exécutable : l'installation se fait sans élévation, et vc_redist.x64.exe,
          # que windeployqt joint sans le lancer, en exigerait une. Sans ces DLL, un poste
          # qui n'a pas le redistribuable ne démarre pas le programme (même défaut et même
          # correctif que MMdedit 0.4.3 et GenFam 8.0.1).
          rm -f dist/MMail/vc_redist*.exe
          crt=$(ls -d "$(cygpath -u "$VCToolsRedistDir")"x64/Microsoft.VC14*.CRT | head -1)
          test -d "$crt"
          cp "$crt"/*.dll dist/MMail/
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do test -f "dist/MMail/$dll"; done
          # windeployqt ne dépose que qwindows.dll : sans la plateforme offscreen,
          # rien ne peut être contrôlé sans session ouverte — ni ici, ni sur un
          # poste, où c'est le seul moyen de vérifier une installation à distance.
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" dist/MMail/platforms/
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -f "$iscc"
          # Double barre : sous Git Bash, « /DAppVersion=… » serait pris pour un
          # chemin et converti, et ISCC y verrait un second nom de script.
          "$iscc" "//DAppVersion=$version" build/socle-mmail.iss
          test -f "dist/MMail-$version-setup.exe"
      - name: Contrôle du paquet Windows
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/MMail/MMail.exe --smoke
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Contrôle Windows — installation par l'installeur
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ce que reçoit le poste, et non le dossier dist : l'installeur doit
          # emporter le runtime Visual C++, faute de quoi le programme installé
          # ne démarre que là où le redistribuable est déjà présent.
          $setup = Get-ChildItem dist\MMail-*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\MMailInstalle"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en echec : code $($p.ExitCode)" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Test-Path "$dir\$dll")) { throw "runtime Visual C++ absent de l'installe : $dll" }
          }
          if (Test-Path "$dir\vc_redist.x64.exe") { throw "vc_redist.x64.exe encore embarque" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $q = Start-Process -FilePath "$dir\MMail.exe" -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($q.ExitCode -ne 0) { throw "fumee de l'installe en echec : code $($q.ExitCode)" }
      - name: Dépôt de l'installeur Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: mmail-windows-setup
          path: dist/*-setup.exe
          if-no-files-found: error

      # ---- Linux : AppImage, seul format qui ne dépende pas de la distribution
      # (pourvu que sa glibc soit au moins celle du runner, cf. la matrice)
      - name: Paquet Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake --install _build --prefix AppDir/usr
          install -Dm644 packaging/mmail.desktop AppDir/usr/share/applications/mmail.desktop
          # linuxdeploy veut une icône PNG : elle est versionnée à côté du .ico,
          # extraite une fois pour toutes de celui-ci. ImageMagick n'est plus
          # installé sur les runners ubuntu-24.04, et une dépendance de plus à la
          # fabrication pour convertir une image ne se justifie pas.
          install -Dm644 assets/mmail.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/mmail.png
          base=https://github.com/linuxdeploy
          curl -sSL -o linuxdeploy.AppImage \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSL -o linuxdeploy-plugin-qt.AppImage \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          # Les runners n'ont pas FUSE : les AppImages doivent s'extraire pour tourner.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS=core/qml
          # linuxdeploy ne dépose que la plateforme xcb : sans offscreen, le
          # paquet ne se contrôle pas sans écran — ni ici, ni sur un poste à
          # distance (même raison que qoffscreen.dll sous Windows).
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          export OUTPUT="MMail-$version-x86_64.AppImage"
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage
          test -f "$OUTPUT"
          mkdir -p dist && mv "$OUTPUT" dist/
      - name: Contrôle du paquet Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Sans les chemins du Qt de construction, que pose install-qt-action :
          # c'est le paquet seul qui doit tenir debout.
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u LD_LIBRARY_PATH \
            QT_QPA_PLATFORM=offscreen ./dist/MMail-*-x86_64.AppImage --smoke
      - name: Dépôt de l'AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mmail-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      # ---- macOS : bundle déployé et image disque (non notarisée) ----------
      - name: Paquet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          cp -R _build/mmail.app dist/MMail.app
          "$QT_ROOT_DIR/bin/macdeployqt" dist/MMail.app -qmldir=core/qml
          # Signature ad hoc : sans elle, macOS refuse un bundle dont les
          # bibliothèques viennent d'être réécrites par macdeployqt. Elle ne
          # remplace pas la notarisation, qui attend un compte développeur payant.
          codesign --force --deep --sign - dist/MMail.app
          hdiutil create -volname "MMail $version" -srcfolder dist/MMail.app \
            -ov -format UDZO "dist/MMail-$version.dmg"
          test -f "dist/MMail-$version.dmg"
      - name: Contrôle du paquet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen ./dist/MMail.app/Contents/MacOS/mmail --smoke
      - name: Dépôt de l'image disque macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mmail-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 est le livrable ; x86_64 n'existe que pour l'émulateur, qui ne
          # sait pas exécuter un APK arm64 à une vitesse utilisable.
          - abi: arm64_v8a
            cible: aarch64-linux-android
            variable: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            emulateur: false
          - abi: x86_64
            cible: x86_64-linux-android
            variable: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            emulateur: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cible }}
      - name: Qt hôte (bureau Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Mémorisation du Qt hôte
        shell: bash
        run: echo "QT_HOST_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Qt Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_${{ matrix.abi }}
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configuration
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          [ -d "$NDK" ] || { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" > /dev/null
          test -d "$NDK"
          HOST="$QT_HOST_DIR"
          maillon="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cible }}26-clang"
          test -x "$maillon"
          echo "${{ matrix.variable }}=$maillon" >> "$GITHUB_ENV"
          export ${{ matrix.variable }}="$maillon"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$NDK" \
            -DQT_HOST_PATH="$HOST"
      - name: Construction APK
        run: cmake --build _build --target apk
      - name: Place pour l'émulateur
        if: matrix.emulateur
        shell: bash
        run: |
          # L'AVD réclame plus de 7 Go pour sa partition de données, et le
          # runner n'en a plus que 5 une fois Qt, le NDK et les dépendances Rust
          # posés. Ces trois outils ne servent à rien ici.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk/2[0-5].* 2>/dev/null || true
          df -h / | tail -1

      - name: Lancement sur émulateur
        if: matrix.emulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Partition bornée : l'essai n'installe qu'un APK de vingt mégaoctets.
          disk-size: 4096M
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Une seule ligne : l'action exécute chaque ligne dans un shell distinct.
          script: bash packaging/essai-android.sh
      - name: Journal de l'émulateur
        if: matrix.emulateur && failure()
        uses: actions/upload-artifact@v4
        with:
          name: mmail-android-logcat
          path: logcat.txt
          if-no-files-found: ignore
      - name: Dépôt de l'APK
        if: matrix.abi == 'arm64_v8a'
        uses: actions/upload-artifact@v4
        with:
          name: mmail-android-arm64
          path: _build/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
