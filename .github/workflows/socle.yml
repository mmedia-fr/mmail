# SPDX-License-Identifier: GPL-3.0-or-later
# Socle Rust / Qt 6 de MMail — fabrication continue sur les quatre cibles.
#
# Chaque cible se construit, s'éprouve (tests du noyau, puis test de fumée : la
# fenêtre se crée, l'index local s'écrit et se relit, le coffre répond) puis
# s'empaquette. Le contrôle porte aussi sur le paquet, et non sur le seul binaire
# de construction : c'est le paquet qui part aux postes.
name: socle

on:
  push:
    branches: [main, "socle/**"]
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.8.3"
  CARGO_TERM_COLOR: always
  # Secret du client Google de MMail (comptes Gmail), lu à la compilation par
  # `option_env!` : livré dans le programme, absent du code source.
  MMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MMAIL_GOOGLE_CLIENT_SECRET }}

jobs:
  bureau:
    name: ${{ matrix.nom }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # L'AppImage embarque tout sauf la glibc du système : elle ne tourne
          # que sur une glibc au moins aussi récente que celle de sa fabrication.
          # Construite sur ubuntu-24.04 (glibc 2.39), elle refusait Debian 12 et
          # Ubuntu 22.04 ; ubuntu-22.04 (glibc 2.35) les couvre.
          - { nom: linux,   os: ubuntu-22.04 }
          - { nom: windows, os: windows-2022 }
          - { nom: macos,   os: macos-14 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core -> ../_build/cargo
          # La clé par défaut ne distingue pas les versions d'Ubuntu : des objets
          # compilés sous glibc 2.39 (__isoc23_*) ne se lient pas sous 2.35.
          key: ${{ matrix.os }}
      - uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ""
          cache: true
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev ninja-build libsecret-1-dev
      - name: MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - name: Configuration
        run: cmake -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release
        shell: bash
        env:
          CMAKE_MAKE_PROGRAM: ninja
      - name: Construction
        run: cmake --build _build --config Release
      - name: Tests du noyau
        run: cargo test --manifest-path core/Cargo.toml
      # ---- Linux : le client contre un vrai Dovecot ---------------------------
      - name: Épreuves contre un Dovecot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Les épreuves de core/src/essais_serveur.rs, jusqu'ici lancées à la
          # main contre le Mailcow de MMEDIA, ici contre un Dovecot du poste de
          # construction : deux comptes jetables, séparateur « / », dossiers à
          # rôle (SPECIAL-USE), « Essais/Clients » créé d'office, boîtes
          # partagées comme chez Mailcow (`Shared/<adresse>/`, droits par
          # SETACL, posés et retirés par l'épreuve). Son certificat
          # est signé par une autorité d'essai ajoutée au magasin du système,
          # celui que lit le client (rustls-platform-verifier) : il vérifie le
          # serveur comme chez un utilisateur. Hors champ : l'envoi SMTP et
          # l'agenda (SOGo), toujours éprouvés à la main.
          set -euo pipefail
          sudo apt-get install -y -q dovecot-imapd > /dev/null
          sudo systemctl stop dovecot
          D=/tmp/mmail-dovecot
          mkdir -p $D/boites
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=MMail autorite d'essai" \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout $D/ac.key -out $D/ac.crt 2> /dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" \
            -keyout $D/serveur.key -out $D/serveur.csr 2> /dev/null
          printf 'subjectAltName=DNS:localhost\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\n' > $D/ext
          openssl x509 -req -in $D/serveur.csr -CA $D/ac.crt -CAkey $D/ac.key -CAcreateserial -days 2 \
            -extfile $D/ext -out $D/serveur.crt 2> /dev/null
          sudo cp $D/ac.crt /usr/local/share/ca-certificates/mmail-essai.crt
          sudo update-ca-certificates > /dev/null
          M1=$(openssl rand -hex 12)
          M2=$(openssl rand -hex 12)
          printf 'un@essai.test:{PLAIN}%s::::::\ndeux@essai.test:{PLAIN}%s::::::\n' "$M1" "$M2" > $D/comptes
          chmod 644 $D/comptes
          cat > $D/dovecot.conf <<FIN
          base_dir = $D/run
          protocols = imap
          listen = 127.0.0.1
          ssl = required
          ssl_cert = <$D/serveur.crt
          ssl_key = <$D/serveur.key
          auth_mechanisms = plain login
          log_path = $D/dovecot.log
          passdb {
            driver = passwd-file
            args = scheme=PLAIN $D/comptes
          }
          userdb {
            driver = static
            args = uid=$(id -u) gid=$(id -g) home=$D/boites/%u
          }
          mail_location = maildir:~/Maildir
          mail_plugins = acl
          # Métadonnées (RFC 5464) en fichier, comme chez Mailcow : le
          # catalogue des catégories d'une boîte (0.6.15).
          mail_attribute_dict = file:%h/dovecot-attributes
          protocol imap {
            mail_plugins = acl imap_acl
            imap_metadata = yes
          }
          plugin {
            acl = vfile
            acl_shared_dict = file:$D/boites/partages.db
          }
          namespace {
            type = shared
            separator = /
            prefix = Shared/%%u/
            location = maildir:%%h/Maildir:INDEXPVT=~/Maildir/Shared/%%u
            subscriptions = no
            list = children
          }
          namespace inbox {
            inbox = yes
            separator = /
            mailbox Drafts {
              special_use = \Drafts
              auto = subscribe
            }
            mailbox Sent {
              special_use = \Sent
              auto = subscribe
            }
            mailbox Trash {
              special_use = \Trash
              auto = subscribe
            }
            mailbox Junk {
              special_use = \Junk
              auto = subscribe
            }
            mailbox Archive {
              special_use = \Archive
              auto = subscribe
            }
            mailbox Essais {
              auto = subscribe
            }
            mailbox "Essais/Clients" {
              auto = subscribe
            }
          }
          FIN
          # Les épreuves lisent une boîte de réception déjà garnie, comme celles
          # du Mailcow : trois messages par compte, objet accentué.
          for u in un@essai.test deux@essai.test; do
            m=$D/boites/$u/Maildir
            mkdir -p $m/cur $m/new $m/tmp
            for i in 1 2 3; do
              printf 'From: Essai MMail <essai@essai.test>\nTo: %s\nSubject: =?UTF-8?Q?Pr=C3=A9paration_d=E2=80=99essai_%s?=\nDate: Fri, 16 Oct 2026 10:0%s:00 +0200\nMessage-ID: <graine-%s-%s@essai.test>\nMIME-Version: 1.0\nContent-Type: text/plain; charset=UTF-8\nContent-Transfer-Encoding: 8bit\n\nMessage d essai %s : été, à, ça.\n' \
                "$u" $i $i $i "${u%@*}" $i > $m/new/graine-$i.essai
            done
          done
          sudo dovecot -c $D/dovecot.conf
          for i in $(seq 30); do (exec 3<> /dev/tcp/127.0.0.1/993) 2> /dev/null && break; sleep 1; done
          MMAIL_HOTE=localhost MMAIL_UTILISATEUR=un@essai.test MMAIL_MOTDEPASSE=$M1 \
          MMAIL_UTILISATEUR2=deux@essai.test MMAIL_MOTDEPASSE2=$M2 \
            cargo test --manifest-path core/Cargo.toml essais_serveur -- --ignored --test-threads=1 \
              --skip envoi_smtp --skip agenda --skip invitation --skip carnet \
            || { sudo cat $D/dovecot.log; exit 1; }
      - name: Test de fumée
        run: ctest --test-dir _build --output-on-failure -C Release
        env:
          QT_QPA_PLATFORM: offscreen

      # ---- Windows : l'installeur que reçoivent les postes -----------------
      - name: Paquet Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          mkdir -p dist/MMail
          # Le nom du fichier compte : les associations « Ouvrir avec » posées par
          # l'installeur désignent MMail.exe, pas le nom de la cible CMake.
          cp _build/mmail.exe dist/MMail/MMail.exe
          "$QT_ROOT_DIR/bin/windeployqt.exe" --release --qmldir core/qml dist/MMail/MMail.exe
          # Runtime Visual C++ (Qt, main.cpp et le noyau Rust en dépendent) déposé à côté
          # de l'exécutable : l'installation se fait sans élévation, et vc_redist.x64.exe,
          # que windeployqt joint sans le lancer, en exigerait une. Sans ces DLL, un poste
          # qui n'a pas le redistribuable ne démarre pas le programme (même défaut et même
          # correctif que MMdedit 0.4.3 et GenFam 8.0.1).
          rm -f dist/MMail/vc_redist*.exe
          crt=$(ls -d "$(cygpath -u "$VCToolsRedistDir")"x64/Microsoft.VC14*.CRT | head -1)
          test -d "$crt"
          cp "$crt"/*.dll dist/MMail/
          for dll in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do test -f "dist/MMail/$dll"; done
          # windeployqt ne dépose que qwindows.dll : sans la plateforme offscreen,
          # rien ne peut être contrôlé sans session ouverte — ni ici, ni sur un
          # poste, où c'est le seul moyen de vérifier une installation à distance.
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" dist/MMail/platforms/
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -f "$iscc"
          # Double barre : sous Git Bash, « /DAppVersion=… » serait pris pour un
          # chemin et converti, et ISCC y verrait un second nom de script.
          "$iscc" "//DAppVersion=$version" build/socle-mmail.iss
          test -f "dist/MMail-$version-setup.exe"
      - name: Contrôle du paquet Windows
        if: runner.os == 'Windows'
        shell: bash
        run: ./dist/MMail/MMail.exe --smoke
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Contrôle Windows — accents des libellés
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Un libellé accentué lu en cp1252 à la compilation sort en « Ã© » :
          # « Deux Ã©tages » dans Affichage › Disposition (0.6.20, Windows
          # seulement). Les chaînes de l'interface sont en UTF-16 dans
          # l'exécutable : on y cherche, aux deux alignements, les suites
          # « Ã + caractère », « Â + caractère » et « â€ » qu'une telle lecture
          # produit, au milieu d'un mot.
          $octets = [IO.File]::ReadAllBytes((Resolve-Path dist\MMail\MMail.exe))
          $cassure = '\u00C3[\u00A0-\u00BF\u0152\u0153\u0160\u0161\u0178\u017D\u017E\u0192\u02C6\u02DC\u2013\u2014\u2018-\u201E\u2020-\u2022\u2026\u2030\u2039\u203A\u20AC\u2122]|\u00C2[\u00A0-\u00BF]|\u00E2\u20AC'
          # Un mot entier : bordé d'autre chose qu'une lettre, ce qui écarte les
          # tables de caractères du binaire.
          $L = '[^\W\d_]'
          $motif = "(?<!$L)[A-Za-z]{2,}(?:$cassure)[a-z]*(?!$L)|(?<!$L)(?:$cassure)[a-z]{3,}(?!$L)"
          $sain = 'Deux ' + [char]0x00E9 + 'tages'
          $casse = 'Deux ' + [char]0x00C3 + [char]0x00A9 + 'tages'
          $trouves = [Collections.Generic.SortedSet[string]]::new()
          $present = $false
          $cassePresente = $false
          foreach ($decalage in 0, 1) {
            $n = $octets.Length - $decalage
            $texte = [Text.Encoding]::Unicode.GetString($octets, $decalage, $n - ($n % 2))
            if ($texte.Contains($sain)) { $present = $true }
            if ($texte.Contains($casse)) { $cassePresente = $true }
            foreach ($m in [regex]::Matches($texte, $motif)) {
              $debut = [Math]::Max(0, $m.Index - 20)
              $extrait = $texte.Substring($debut, [Math]::Min($texte.Length - $debut, $m.Length + 40))
              [void]$trouves.Add(($extrait -replace '[^\u0020-\u007E\u00A0-\u00FF\u0152\u0153\u2013-\u2030\u20AC]', '|'))
            }
          }
          Write-Host "« $sain » en UTF-16 : $present ; « $casse » : $cassePresente"
          Write-Host "$($trouves.Count) libellé(s) cassé(s) :"
          $trouves | Select-Object -First 60 | ForEach-Object { Write-Host "  $_" }
          if ($trouves.Count -gt 0) { throw "des libellés accentués sont cassés dans MMail.exe" }
          if (-not $present) { throw "« Deux étages » introuvable en UTF-16 dans MMail.exe" }
      - name: Contrôle Windows — icône de l'exécutable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # L'icône que l'explorateur affiche (ressource de build/mmail.rc.in) : sans
          # elle, Windows rend son icône générique, sans rouge. Le centre de l'icône
          # de MMail est le creux du M, rouge.
          Add-Type -AssemblyName System.Drawing
          $icone = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path dist\MMail\MMail.exe))
          $image = $icone.ToBitmap()
          $c = $image.GetPixel([int]($image.Width / 2), [int]($image.Height / 2))
          Write-Host "icône $($image.Width)x$($image.Height), centre R=$($c.R) V=$($c.G) B=$($c.B)"
          if ($c.R -lt 180 -or $c.G -gt 120) { throw "l'exécutable ne porte pas l'icône de MMail" }
      - name: Contrôle Windows — installation par l'installeur
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Ce que reçoit le poste, et non le dossier dist : l'installeur doit
          # emporter le runtime Visual C++, faute de quoi le programme installé
          # ne démarre que là où le redistribuable est déjà présent.
          $setup = Get-ChildItem dist\MMail-*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\MMailInstalle"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installation en echec : code $($p.ExitCode)" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Test-Path "$dir\$dll")) { throw "runtime Visual C++ absent de l'installe : $dll" }
          }
          if (Test-Path "$dir\vc_redist.x64.exe") { throw "vc_redist.x64.exe encore embarque" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $q = Start-Process -FilePath "$dir\MMail.exe" -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($q.ExitCode -ne 0) { throw "fumee de l'installe en echec : code $($q.ExitCode)" }
      - name: Contrôle Windows — mise à jour assistée
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # L'installé se croit ancien (MMAIL_VERSION_ESSAI) : il propose la
          # dernière publication, la télécharge, en contrôle l'empreinte et se
          # ferme ; son installeur attend sa fin, installe sans question et le
          # rouvre (cf. cpp/installeur.h, build/socle-mmail.iss). Le serveur de
          # messagerie de l'essai n'existe pas : seule la mise à jour compte.
          $dir = "$env:RUNNER_TEMP\MMailInstalle"
          $publiee = (Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GITHUB_TOKEN" } `
            https://api.github.com/repos/mmedia-fr/mmail/releases/latest).tag_name.TrimStart('v')
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $env:MMAIL_VERSION_ESSAI = "0.0.1"
          $env:MMAIL_SCENARIO = "mise-a-jour"
          # Demande authentifiée à l'API de GitHub : sans jeton, la limite de
          # 60 demandes par heure, partagée entre les travaux de la machine,
          # laissait la vérification sans réponse (cf. mise_a_jour.rs).
          $env:MMAIL_JETON_GITHUB = $env:GITHUB_TOKEN
          $env:MMAIL_HOTE = "essai.invalid"
          $env:MMAIL_UTILISATEUR = "essai@essai.invalid"
          $env:MMAIL_MOTDEPASSE = "-"
          $env:MMAIL_PROFIL = "$env:RUNNER_TEMP\profil-maj\index.sqlite"
          $env:MMAIL_SORTIE = "$env:RUNNER_TEMP\sortie-maj"
          New-Item -ItemType Directory -Force $env:MMAIL_SORTIE | Out-Null
          $p = Start-Process -FilePath "$dir\MMail.exe" -PassThru `
            -RedirectStandardError "$env:RUNNER_TEMP\maj.err" -RedirectStandardOutput "$env:RUNNER_TEMP\maj.out"
          $ferme = $p.WaitForExit(300000)
          Get-Content "$env:RUNNER_TEMP\maj.err" | Select-String "scenario|rror|chec|mise à jour"
          if (-not $ferme) { Stop-Process $p -Force; throw "MMail ne s'est pas fermé pour la mise à jour" }
          $cle = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{2F1D7A94-6C83-4E51-9B0A-7D3E5C8F1A62}_is1'
          $echeance = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 3
            $version = (Get-ItemProperty $cle -ErrorAction SilentlyContinue).DisplayVersion
            $rouvert = Get-Process MMail -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir\*" }
          } until (($version -eq $publiee -and $rouvert) -or (Get-Date) -gt $echeance)
          Write-Host "publiée $publiee | installée $version | rouvert $([bool]$rouvert)"
          $journal = "$env:LOCALAPPDATA\M-Media\MMail\mises-a-jour\derniere-installation.log"
          if (Test-Path $journal) { Get-Content $journal | Select-String "MMail|processus|Run|Filename" }
          $rouvert | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($version -ne $publiee) { throw "version installée : $version, attendue : $publiee" }
          # C'est l'installeur publié qui s'exécute : la relance n'existe qu'à
          # partir de celui de la 0.5.8 (l'étape suivante éprouve celui-ci).
          if ([version]$publiee -ge [version]"0.5.8" -and -not $rouvert) {
            throw "MMail n'a pas été rouvert après la mise à jour"
          }
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Contrôle Windows — installeur, attente et relance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # L'installeur de cette fabrication, lancé comme MMail le lance : il
          # doit attendre la fin du processus désigné avant d'installer, puis
          # rouvrir MMail (cf. [Code] de build/socle-mmail.iss).
          $setup = Get-ChildItem dist\MMail-*-setup.exe | Select-Object -First 1
          $attendue = $setup.Name -replace '^MMail-(.*)-setup\.exe$', '$1'
          $dir = "$env:RUNNER_TEMP\MMailInstalle"
          $journal = "$env:RUNNER_TEMP\installation-relance.log"
          # Un processus de vingt secondes tient le rôle de MMail.
          $attente = Start-Process -FilePath "$env:SystemRoot\System32\ping.exe" -ArgumentList "-n", "21", "127.0.0.1" `
            -PassThru -WindowStyle Hidden
          $env:QT_QPA_PLATFORM = "offscreen"
          # WaitForExit, et non -Wait, qui attendrait aussi le MMail rouvert.
          $p = Start-Process -FilePath $setup.FullName -PassThru -ArgumentList "/SILENT", "/SUPPRESSMSGBOXES", `
            "/NORESTART", "/SP-", "/CURRENTUSER", "/ATTENDRE=$($attente.Id)", "/RELANCER=1", "/LOG=`"$journal`""
          if (-not $p.WaitForExit(300000)) { throw "installeur toujours en cours après cinq minutes" }
          Get-Content $journal | Select-String "MMail|processus|Filename"
          if ($p.ExitCode -ne 0) { throw "installation en echec : code $($p.ExitCode)" }
          if (-not $attente.HasExited) { throw "l'installeur n'a pas attendu la fin du processus" }
          if (-not (Select-String -Path $journal -Pattern "MMail est ferm" -Quiet)) { throw "attente absente du journal" }
          $cle = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{2F1D7A94-6C83-4E51-9B0A-7D3E5C8F1A62}_is1'
          $version = (Get-ItemProperty $cle).DisplayVersion
          $echeance = (Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 2
            $rouvert = Get-Process MMail -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$dir\*" }
          } until ($rouvert -or (Get-Date) -gt $echeance)
          Write-Host "installée $version (attendue $attendue) | rouvert $([bool]$rouvert)"
          $rouvert | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($version -ne $attendue) { throw "version installée : $version, attendue : $attendue" }
          if (-not $rouvert) { throw "MMail n'a pas été rouvert après l'installation" }
      - name: Dépôt de l'installeur Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-windows-setup
          path: dist/*-setup.exe
          if-no-files-found: error

      # ---- Linux : AppImage, seul format qui ne dépende pas de la distribution
      # (pourvu que sa glibc soit au moins celle du runner, cf. la matrice)
      - name: Paquet Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          cmake --install _build --prefix AppDir/usr
          install -Dm644 packaging/mmail.desktop AppDir/usr/share/applications/mmail.desktop
          # linuxdeploy veut une icône PNG : elle est versionnée à côté du .ico,
          # réduite une fois pour toutes, avec les autres tailles du bureau
          # (packaging/icones). ImageMagick n'est plus installé sur les runners
          # ubuntu-24.04, et une dépendance de plus à la fabrication pour
          # convertir une image ne se justifie pas.
          install -Dm644 assets/mmail.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/mmail.png
          for t in 16 24 32 48 64 128 512; do
            install -Dm644 "packaging/icones/mmail-$t.png" \
              "AppDir/usr/share/icons/hicolor/${t}x${t}/apps/mmail.png"
          done
          base=https://github.com/linuxdeploy
          curl -sSL -o linuxdeploy.AppImage \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSL -o linuxdeploy-plugin-qt.AppImage \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          # Empreintes des versions éprouvées (0.6.4) : un outil changé à la
          # source arrête la fabrication au lieu d'entrer dans un paquet
          # publié. Une mise à jour voulue change ces deux lignes.
          echo "8aea8da0f7f7039d2a2cecb14657d752a222a5e1d3825caeef186c82f751cdd1  linuxdeploy.AppImage" > outils.sha256
          echo "cfc1055b2b9dbc08412b579f20990b7b41a17b61beaa5847dc9477c96c9e9617  linuxdeploy-plugin-qt.AppImage" >> outils.sha256
          sha256sum -c outils.sha256
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          # Les runners n'ont pas FUSE : les AppImages doivent s'extraire pour tourner.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS=core/qml
          # linuxdeploy ne dépose que la plateforme xcb : sans offscreen, le
          # paquet ne se contrôle pas sans écran — ni ici, ni sur un poste à
          # distance (même raison que qoffscreen.dll sous Windows).
          export EXTRA_PLATFORM_PLUGINS=libqoffscreen.so
          export OUTPUT="MMail-$version-x86_64.AppImage"
          ./linuxdeploy.AppImage --appdir AppDir --plugin qt --output appimage
          test -f "$OUTPUT"
          mkdir -p dist && mv "$OUTPUT" dist/
      - name: Contrôle du paquet Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          # Sans les chemins du Qt de construction, que pose install-qt-action :
          # c'est le paquet seul qui doit tenir debout.
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH -u LD_LIBRARY_PATH \
            QT_QPA_PLATFORM=offscreen ./dist/MMail-*-x86_64.AppImage --smoke
      - name: Dépôt de l'AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      # ---- macOS : bundle déployé et image disque (non notarisée) ----------
      - name: Paquet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^project(mmail VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          mkdir -p dist
          cp -R _build/mmail.app dist/MMail.app
          "$QT_ROOT_DIR/bin/macdeployqt" dist/MMail.app -qmldir=core/qml
          # Signature ad hoc : sans elle, macOS refuse un bundle dont les
          # bibliothèques viennent d'être réécrites par macdeployqt. Elle ne
          # remplace pas la notarisation, qui attend un compte développeur payant.
          codesign --force --deep --sign - dist/MMail.app
          hdiutil create -volname "MMail $version" -srcfolder dist/MMail.app \
            -ov -format UDZO "dist/MMail-$version.dmg"
          test -f "dist/MMail-$version.dmg"
      - name: Contrôle du paquet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen ./dist/MMail.app/Contents/MacOS/mmail --smoke
      - name: Dépôt de l'image disque macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 est le livrable ; x86_64 n'existe que pour l'émulateur, qui ne
          # sait pas exécuter un APK arm64 à une vitesse utilisable.
          - abi: arm64_v8a
            cible: aarch64-linux-android
            variable: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            emulateur: false
          - abi: x86_64
            cible: x86_64-linux-android
            variable: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            emulateur: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.cible }}
      - name: Qt hôte (bureau Linux)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Mémorisation du Qt hôte
        shell: bash
        run: echo "QT_HOST_DIR=$QT_ROOT_DIR" >> "$GITHUB_ENV"
      - name: Qt Android
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_${{ matrix.abi }}
          # La page de connexion Microsoft intégrée (cf. ConnexionIntegree.qml).
          modules: qtwebview
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configuration
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          [ -d "$NDK" ] || { yes || true; } | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" > /dev/null
          test -d "$NDK"
          HOST="$QT_HOST_DIR"
          maillon="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cible }}26-clang"
          test -x "$maillon"
          echo "${{ matrix.variable }}=$maillon" >> "$GITHUB_ENV"
          export ${{ matrix.variable }}="$maillon"
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B _build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$NDK" \
            -DQT_HOST_PATH="$HOST"
      - name: Construction APK
        run: cmake --build _build --target apk
      - name: Icône de l'APK
        shell: bash
        run: |
          # Le manifeste de packaging/android désigne l'icône du lanceur : sans lui,
          # l'APK n'en a aucune et Android affiche son icône générique.
          apk=$(find _build/android-build -name '*.apk' | head -n 1)
          aapt2=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)/aapt2
          "$aapt2" dump badging "$apk" | grep -E "^application(-icon-[0-9]+)?:" | tee badging.txt
          grep -q "icon='res/" badging.txt || { echo "l'APK n'a pas d'icône" >&2; exit 1; }
          grep -q "label='MMail'" badging.txt || { echo "l'APK ne s'affiche pas sous le nom MMail" >&2; exit 1; }
      - name: Place pour l'émulateur
        if: matrix.emulateur
        shell: bash
        run: |
          # L'AVD réclame plus de 7 Go pour sa partition de données, et le
          # runner n'en a plus que 5 une fois Qt, le NDK et les dépendances Rust
          # posés. Ces trois outils ne servent à rien ici.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/lib/android/sdk/ndk/2[0-5].* 2>/dev/null || true
          df -h / | tail -1

      # Sans accès à /dev/kvm, l'émulateur tourne sans accélération : l'interface
      # de MMail y mettait deux minutes et demie à se charger (21/10), assez pour
      # fausser l'essai de veille. La règle udev ouvre /dev/kvm au runner.
      - name: Accélération de l'émulateur
        if: matrix.emulateur
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "pas de /dev/kvm : émulateur sans accélération"
      - name: Lancement sur émulateur
        if: matrix.emulateur
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          # Partition bornée : l'essai n'installe qu'un APK de vingt mégaoctets.
          disk-size: 4096M
          arch: x86_64
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Une seule ligne : l'action exécute chaque ligne dans un shell distinct.
          script: bash packaging/essai-android.sh
      # Toujours déposé : les captures de l'essai de veille (0.6.10) se
      # regardent aussi quand il passe.
      - name: Journal de l'émulateur
        if: matrix.emulateur && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-android-logcat
          path: |
            logcat.txt
            lanceur-*.png
            veille-*.png
            retour-*.png
            connexion-*.png
            ui*.xml
            vues-*.txt
          if-no-files-found: ignore
      - name: Dépôt de l'APK
        if: matrix.abi == 'arm64_v8a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-android-arm64
          path: _build/android-build/build/outputs/apk/**/*.apk
          if-no-files-found: error
      # APK x86_64 (non signé) : le seul que l'émulateur d'essai de srvandroid
      # exécute à une vitesse utilisable — l'arm64 y passe par la traduction,
      # 20 à 45 s par action et un affichage qui ne se redessine plus.
      - name: Dépôt de l'APK x86_64
        if: matrix.abi == 'x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mmail-android-x86_64
          path: _build/android-build/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
