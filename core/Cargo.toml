[package]
name = "mmail_core"
version = "0.6.33"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
# staticlib pour la liaison avec Qt ; rlib pour que `cargo test` compile les
# tests du noyau.
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
# Correcteur d'orthographe (0.6.36) : dictionnaires au format de Hunspell, sans
# bibliothèque du système ; dictionnaire français de Grammalecte dans dictionnaires/.
spellbook = "0.4.2"

# TLS en pur Rust : pas d'OpenSSL à compiler pour Android.
rustls = "0.23"
# Empreinte SHA-256 des paquets de mise à jour : le fournisseur cryptographique
# que rustls compile déjà, avec les mêmes options — rien de plus à construire.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

# Analyse des en-têtes et des corps MIME. C'est la surface d'attaque du client :
# d'où un analyseur éprouvé, en Rust, plutôt qu'écrit à la main.
mail-parser = "0.11"

# Index local (décision 14 du dossier de projet). « bundled » compile SQLite
# avec le programme : rien à installer sur les postes, et la même version
# partout, Android compris.
rusqlite = { version = "0.37", features = ["bundled", "functions"] }

# Fabrication des messages envoyés (MIME, encodage des en-têtes, pièces
# jointes) : le pendant de mail-parser, du même auteur.
mail-builder = "0.4"

# Messages échangés avec la fenêtre de rédaction, en JSON : dans ce sens-là,
# un analyseur éprouvé plutôt qu'écrit à la main.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Affichage des messages HTML : analyse HTML5 (celle de Servo) et tri des
# balises et attributs. Le HTML d'un courriel est une donnée non fiable — un
# assainisseur éprouvé plutôt qu'écrit à la main.
ammonia = "4.2"

# Document de configuration automatique (format « autoconfig ») et réponses
# CalDAV : un analyseur XML sans dépendance, qui refuse les DTD et donc les
# entités.
roxmltree = "0.20"

# Agenda : les règles de répétition iCalendar (RRULE, EXDATE, RDATE) et les
# fuseaux horaires IANA. SOGo ne développe pas les répétitions (`expand`
# ignoré) : le calcul se fait ici, par une implantation éprouvée plutôt
# qu'écrite à la main.
rrule = "0.14"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
# Nom IANA du fuseau du poste (« Europe/Paris »), pour écrire les heures d'un
# événement : chrono sait le décalage local, pas son nom. Déjà tiré par chrono.
iana-time-zone = "0.1"

# Badge animé de la signature (0.6.17, option) : les images de l'animation se
# dessinent en pur Rust — chemins, masques et opacité anticrénelés, sans
# aller-retour par Qt ni dépendance système —, puis s'assemblent en GIF animé.
# Sans les formats de fichier de tiny-skia : les images arrivent déjà décodées.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
gif = "0.14"
# Palette de chaque image du badge, calculée sur ses seuls pixels changés
# (0.6.18). Déjà tirée par gif, même version.
color_quant = "1.1"

# S/MIME (0.8.0) : structures CMS et X.509, en Rust et sans cryptographie —
# AWS-LC (aws-lc-rs) fait les calculs, rustls-webpki contrôle les chaînes.
# `der` 0.8 lit le BER : Outlook et Thunderbird écrivent leurs enveloppes en
# longueurs indéfinies, que `der` 0.7 refuse ; 0.8.3 corrige un débordement
# de pile sur les BER imbriqués. `cms` 0.3 n'est pas encore sortie : version
# figée, celle qu'exige `pkcs12` (par p12-keystore), pour n'en compiler qu'une.
cms = { version = "=0.3.0-pre.1", default-features = false, features = ["std"] }
x509-cert = "0.3"
der = { version = "0.8.3", features = ["alloc", "ber", "oid"] }
spki = "0.8"
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "aws-lc-rs"] }
# Import des certificats personnels (.p12) : formats récents et anciens.
p12-keystore = "0.4.1"
# 3DES, pour relire d'anciens messages : AWS-LC ne l'expose qu'avec ses
# liaisons complètes, que `bindgen` devrait produire pour l'émulateur Android.
# Déjà tirés par p12-keystore.
des = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }

# Autorités de certification : celles du système sur le bureau, par le
# vérificateur de plateforme. Sous Android, ce vérificateur exige un composant
# Java et une initialisation JNI que l'APK n'embarque pas : on y prend les
# autorités de Mozilla, compilées avec le programme.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.6"
# Autorités du système pour les signatures S/MIME (le vérificateur de
# plateforme ne sert qu'aux serveurs TLS) ; déjà tiré sous Linux.
rustls-native-certs = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[build-dependencies]
cxx-qt-build = "0.10"
