[package]
name = "mmail_core"
version = "0.2.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
# staticlib pour la liaison avec Qt ; rlib pour que `cargo test` compile les
# tests du noyau.
crate-type = ["staticlib", "rlib"]

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }

# TLS en pur Rust : pas d'OpenSSL à compiler pour Android.
rustls = "0.23"

# Analyse des en-têtes et des corps MIME. C'est la surface d'attaque du client :
# d'où un analyseur éprouvé, en Rust, plutôt qu'écrit à la main.
mail-parser = "0.11"

# Index local (décision 14 du dossier de projet). « bundled » compile SQLite
# avec le programme : rien à installer sur les postes, et la même version
# partout, Android compris.
rusqlite = { version = "0.37", features = ["bundled"] }

# Fabrication des messages envoyés (MIME, encodage des en-têtes, pièces
# jointes) : le pendant de mail-parser, du même auteur.
mail-builder = "0.4"

# Messages échangés avec la fenêtre de rédaction, en JSON : dans ce sens-là,
# un analyseur éprouvé plutôt qu'écrit à la main.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Document de configuration automatique (format « autoconfig ») : un analyseur
# XML sans dépendance, qui refuse les DTD et donc les entités.
roxmltree = "0.20"

# Autorités de certification : celles du système sur le bureau, par le
# vérificateur de plateforme. Sous Android, ce vérificateur exige un composant
# Java et une initialisation JNI que l'APK n'embarque pas : on y prend les
# autorités de Mozilla, compilées avec le programme.
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"

[build-dependencies]
cxx-qt-build = "0.10"
